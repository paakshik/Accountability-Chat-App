kind = "web"
previewPath = "/"
title = "Accountability Chat"
description = "A private accountability partner that keeps a factual record of goals, check-ins, and predefined consequences, with optional timed escalation to an agreed contact."
version = "1.0.0"
id = "artifacts/accountability-chat"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18666

[services.development]
run = "pnpm --filter @workspace/accountability-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/accountability-chat", "run", "build" ]
serve = "static"
publicDir = "artifacts/accountability-chat/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18666"
BASE_PATH = "/"
